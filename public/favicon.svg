<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="50" cy="50" r="48" fill="url(#healthGrad)"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Medical cross (white) -->
  <rect x="42" y="20" width="16" height="60" rx="3" fill="white"/>
  <rect x="20" y="42" width="60" height="16" rx="3" fill="white"/>
  
  <!-- Inner highlight on cross -->
  <rect x="44" y="22" width="12" height="56" rx="2" fill="rgba(255,255,255,0.8)"/>
  <rect x="22" y="44" width="56" height="12" rx="2" fill="rgba(255,255,255,0.8)"/>
</svg>
